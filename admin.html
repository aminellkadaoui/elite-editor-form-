<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Editor — لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#6d5cff; --brand-ink:#5a3ff0; --ink:#17191f; --soft:#565f70; --faint:#8a90a0;
  --line:#e8e9f1; --bg:#f3f4f8; --card:#fff; --dark:#16181d; --ok:#12915a; --err:#c0392b;
  --ar:'IBM Plex Sans Arabic',sans-serif; --mono:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--ar);background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.mono{font-family:var(--mono);direction:ltr;unicode-bidi:plaintext}

/* تسجيل دخول */
#login{max-width:400px;margin:13vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;
  box-shadow:0 24px 60px -34px rgba(24,26,52,.35),0 3px 10px -6px rgba(24,26,52,.10);padding:32px 28px;text-align:center}
#login .brand{font-weight:700;font-size:19px;margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:8px}
#login .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--brand)}
#login p{color:var(--faint);font-size:13.5px;margin-bottom:22px}
#login input{width:100%;font-family:var(--ar);font-size:15px;border:1.5px solid var(--line);border-radius:10px;
  padding:12px 14px;margin-bottom:10px;outline:none;direction:ltr;text-align:right;transition:border-color .17s,box-shadow .17s}
#login input:focus{border-color:var(--brand);box-shadow:0 0 0 3.5px rgba(109,92,255,.13)}
#login button{width:100%;height:48px;background:var(--dark);color:#fff;border:0;border-radius:60px;
  font-family:var(--ar);font-weight:600;font-size:16px;cursor:pointer;transition:transform .12s,background .17s}
#login button:hover{background:#000}
#login button:active{transform:scale(.97)}
#login .msg{color:var(--err);font-size:13px;margin-top:10px;min-height:18px}

/* هيدر */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:26px 0 8px;flex-wrap:wrap}
header .brand{font-weight:700;font-size:19px;display:flex;align-items:center;gap:8px}
header .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--brand)}
header .tools{display:flex;gap:8px;align-items:center}
.ibtn{font-family:var(--ar);font-size:13px;font-weight:600;border:1.5px solid var(--line);background:#fff;color:var(--soft);
  border-radius:60px;padding:8px 18px;cursor:pointer;transition:border-color .17s,background .17s,transform .12s}
.ibtn:hover{border-color:#cfd3e0;background:#fafbfc}
.ibtn:active{transform:scale(.97)}
.ibtn.p{background:var(--dark);color:#fff;border:0}
.ibtn.p:hover{background:#000}

.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--brand-ink);text-transform:uppercase;direction:ltr;margin:30px 0 12px}

/* بطاقات إحصائية */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;text-align:center;
  box-shadow:0 3px 10px -6px rgba(24,26,52,.08)}
.stat .v{font-family:var(--mono);font-size:28px;font-weight:600;color:var(--brand);direction:ltr}
.stat .k{font-size:13px;color:var(--soft);margin-top:2px}

/* تحليل */
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.agrid{grid-template-columns:1fr}}
.acard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;
  box-shadow:0 3px 10px -6px rgba(24,26,52,.08)}
.acard h3{font-size:14.5px;font-weight:700;margin-bottom:12px}
.drow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.drow .dl{flex:0 0 42%;font-size:12.5px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .db{flex:1;height:8px;background:#eef0f7;border-radius:99px;overflow:hidden;direction:ltr}
.drow .db i{display:block;height:100%;background:var(--brand);border-radius:99px}
.drow .dc{flex:0 0 34px;font-family:var(--mono);font-size:12px;color:var(--faint);direction:ltr;text-align:left}

/* واتساب */
.wa-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.wa-row:first-child{border-top:0}
.wa-row .n{flex:1;font-weight:600}
.wa-row .num{font-family:var(--mono);direction:ltr}
.wa-row a{color:var(--ok);text-decoration:none;font-weight:600;font-size:12.5px}

/* جدول الردود */
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
th,td{text-align:right;padding:11px 14px;font-size:13.5px;border-bottom:1px solid var(--line)}
th{background:#f6f7fb;font-weight:700;font-size:12.5px;color:var(--soft)}
tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}
tr.clk:hover{background:#faf9ff}
.badge{font-family:var(--mono);font-size:11px;border-radius:99px;padding:2px 9px;direction:ltr;background:#f1f2f8;color:var(--soft)}
.badge.hi{background:rgba(109,92,255,.10);color:var(--brand-ink)}

/* تفصيل رد */
#detail{display:none;position:fixed;inset:0;z-index:40;background:rgba(24,26,52,.42);backdrop-filter:blur(3px);padding:20px;overflow:auto}
#detail.on{display:block}
.dcard{max-width:680px;margin:24px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 24px;
  box-shadow:0 24px 60px -30px rgba(24,26,52,.45)}
.dcard .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.dcard .dh h2{font-size:18px;font-weight:700}
.dcard .x{border:1.5px solid var(--line);background:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px;color:var(--soft)}
.dcard .x:hover{border-color:#cfd3e0}
.qa{padding:10px 0;border-top:1px dashed rgba(0,0,0,.08)}
.qa:first-child{border-top:0}
.qa .ql{font-size:12.5px;color:var(--faint);margin-bottom:2px}
.qa .qv{font-size:14.5px;font-weight:500}
.empty{text-align:center;color:var(--faint);padding:40px 0;font-size:15px}
</style>
</head>
<body>

<!-- تسجيل دخول -->
<div id="login">
  <div class="brand"><span class="dot"></span>Elite Editor — لوحة التحكم</div>
  <p>الدخول لأمين فقط</p>
  <input id="email" type="email" placeholder="Email" autocomplete="username">
  <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
  <button id="loginBtn">دخول</button>
  <div class="msg" id="loginMsg"></div>
</div>

<!-- التطبيق -->
<div id="app" style="display:none"><div class="wrap">
  <header>
    <span class="brand"><span class="dot"></span>Elite Editor — الردود</span>
    <div class="tools">
      <button class="ibtn" id="refreshBtn">⟳ تحديث</button>
      <button class="ibtn p" id="csvBtn">⬇ تصدير CSV</button>
      <button class="ibtn" id="logoutBtn">خروج</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="eyebrow">Analytics — تحليل تجميعي</div>
  <div class="agrid" id="analytics"></div>

  <div class="eyebrow">WhatsApp — أرقام المشاركين</div>
  <div class="acard" id="waList"><div class="empty">—</div></div>

  <div class="eyebrow">كل الردود</div>
  <div id="tableWrap"><div class="empty">جارٍ التحميل…</div></div>
</div></div>

<div id="detail"><div class="dcard"><div class="dh"><h2>تفاصيل الرد</h2><button class="x" id="dClose">✕</button></div><div id="dBody"></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyAou6PxuGGpDSNnmZ1ja4eMYIke3OR_sXY",
  authDomain: "elite-editor-9fe62.firebaseapp.com",
  projectId: "elite-editor-9fe62",
  storageBucket: "elite-editor-9fe62.firebasestorage.app",
  messagingSenderId: "705152552088",
  appId: "1:705152552088:web:c9b082ee8d5f0a1565d4ed"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const COLLECTION="elite_responses";
/* القراءة عبر REST API — يتجاوز مانع الإعلانات الذي يحجب اتصال الـSDK */
const FS_DBS=["default","(default)"]; // نجرّب الاسمين
const fsDocs=id=>"https://firestore.googleapis.com/v1/projects/"+firebaseConfig.projectId+"/databases/"+id+"/documents";
function fsValue(v){
  if(v==null)return null;
  if('stringValue' in v)return v.stringValue;
  if('integerValue' in v)return +v.integerValue;
  if('doubleValue' in v)return v.doubleValue;
  if('booleanValue' in v)return v.booleanValue;
  if('timestampValue' in v)return v.timestampValue;
  if('nullValue' in v)return null;
  if('arrayValue' in v)return (v.arrayValue.values||[]).map(fsValue);
  if('mapValue' in v)return fsFields(v.mapValue.fields);
  return null;
}
function fsFields(fields){const o={};for(const k in (fields||{}))o[k]=fsValue(fields[k]);return o;}

/* خريطة الأسئلة: مفتاح → {label, kind} — kind: choice|multi|scale|text|num */
const F={
 name:["الاسم","text"],whatsapp:["واتساب","text"],
 clients_count:["عدد العملاء","choice"],
 work_mode:["طريقة العمل","choice"],
 level:["المستوى","choice"],
 pressures:["أكثر ما يضغطه","multi"],
 bad_day:["يوم سيئ","text"],
 organize:["تنظيم المشاريع","choice"],
 files_delivery:["وصول الملفات","choice"],
 urgent_edit:["التعديل العاجل","choice"],
 workday_end:["نهاية يوم العمل","choice"],
 no_project_days:["أيام بلا مشروع","choice"],
 client_questions:["أسئلة العميل","choice"],
 pricing_method:["طريقة التسعير","choice"],
 client_perception:["نظرة العميل له","choice"],
 desired_results:["النتائج المطلوبة","multi"],
 blockers:["ما يمنعه من الوصول","choice"],
 one_change:["تغيير واحد","text"],
 trust_content:["محتوى يثق به","choice"],
 join_blockers:["موانع الانضمام","choice"],
 worth_paying:["ما يستحق الدفع","text"],
 anon_consent:["موافقة الاقتباس","choice"],
};
/* الحقول التي نعرض توزيعها في التحليل */
const ANALYZE=["clients_count","work_mode","level","organize","files_delivery","urgent_edit","workday_end","no_project_days","client_questions","pricing_method","client_perception","blockers","trust_content","join_blockers","anon_consent"];

let ROWS=[];
const $=id=>document.getElementById(id);
const esc=s=>{const d=document.createElement('span');d.textContent=(s??'');return d.innerHTML;};
const val=v=>Array.isArray(v)?v.map(x=>x==='__other__'?'آخر':x).join('، '):(v==='__other__'?'آخر':v);

/* دخول */
$('loginBtn').onclick=async()=>{
  $('loginMsg').textContent='';
  try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('pass').value);}
  catch(e){$('loginMsg').textContent='بيانات الدخول غير صحيحة';}
};
$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click();});
$('logoutBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
  if(u){$('login').style.display='none';$('app').style.display='block';load();}
  else{$('login').style.display='block';$('app').style.display='none';}
});

async function load(){
  $('tableWrap').innerHTML='<div class="empty">جارٍ التحميل…</div>';
  try{
    const token=await auth.currentUser.getIdToken();
    // اكتشاف اسم قاعدة البيانات الصحيح
    let dbid=null;
    for(const id of FS_DBS){
      const r=await fetch(fsDocs(id)+"/"+COLLECTION+"?pageSize=1",{headers:{Authorization:'Bearer '+token}});
      if(r.ok){dbid=id;break;}
      if(r.status!==404){const t=await r.text();throw new Error('HTTP '+r.status+' — '+t.slice(0,140));}
    }
    if(!dbid)throw new Error('قاعدة البيانات غير موجودة');
    let docs=[],pageToken='';
    do{
      const u=fsDocs(dbid)+"/"+COLLECTION+"?pageSize=300"+(pageToken?("&pageToken="+encodeURIComponent(pageToken)):"");
      const res=await fetch(u,{headers:{Authorization:'Bearer '+token}});
      if(!res.ok){const t=await res.text();throw new Error('HTTP '+res.status+' — '+t.slice(0,140));}
      const j=await res.json();
      (j.documents||[]).forEach(d=>docs.push(Object.assign({id:d.name.split('/').pop(),__ct:d.createTime},fsFields(d.fields))));
      pageToken=j.nextPageToken||'';
    }while(pageToken);
    docs.sort((a,b)=>String(b.submittedAt||b.__ct||'').localeCompare(String(a.submittedAt||a.__ct||'')));
    ROWS=docs;
    render();
  }catch(e){
    console.error('load error:',e);
    $('tableWrap').innerHTML='<div class="empty">تعذّر التحميل: '+esc(e.message||e)+'</div>';
  }
}
$('refreshBtn').onclick=load;

function render(){
  // إحصائيات
  const n=ROWS.length;
  const withClients=ROWS.filter(r=>r.clients_count&&r.clients_count!=='لم أتعامل مع عميل').length;
  const consent=ROWS.filter(r=>String(r.anon_consent||'')==='نعم').length;
  const burnout=ROWS.filter(r=>Array.isArray(r.pressures)&&r.pressures.some(x=>/Burnout|المتعة/.test(x))).length;
  $('stats').innerHTML=[
    ['الردود',n],['عملوا مع عملاء',withClients],['يسمحون بالاقتباس',consent],['يعانون Burnout',burnout]
  ].map(([k,v])=>`<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('');

  // تحليل توزيعات
  $('analytics').innerHTML=ANALYZE.map(k=>{
    const counts={};ROWS.forEach(r=>{const v=r[k];if(v==null||v==='')return;counts[v]=(counts[v]||0)+1;});
    const items=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    const max=items.length?items[0][1]:1;
    if(!items.length)return '';
    return `<div class="acard"><h3>${F[k][0]}</h3>`+items.map(([lbl,c])=>
      `<div class="drow"><span class="dl" title="${esc(lbl)}">${esc(lbl)}</span><span class="db"><i style="width:${Math.max(6,100*c/max)}%"></i></span><span class="dc">${c}</span></div>`
    ).join('')+`</div>`;
  }).join('');

  // واتساب — كل من ترك رقمًا
  const wa=ROWS.filter(r=>String(r.whatsapp||'').replace(/[^0-9]/g,'').length>=6);
  $('waList').innerHTML=wa.length?wa.map(r=>{
    const num=String(r.whatsapp||'').replace(/[^0-9]/g,'');
    return `<div class="wa-row"><span class="n">${esc(r.name)}</span><span class="num">${esc(r.whatsapp)}</span>`+
      (num?`<a href="https://wa.me/${num}" target="_blank">فتح واتساب ↗</a>`:'')+`</div>`;
  }).join(''):'<div class="empty">لا أحد وافق بعد</div>';

  // الجدول
  if(!n){$('tableWrap').innerHTML='<div class="empty">لا ردود بعد — شارك رابط الفورم 🙂</div>';return;}
  $('tableWrap').innerHTML=`<table><thead><tr><th>الاسم</th><th>طريقة العمل</th><th>العملاء</th><th>الاقتباس</th><th>التاريخ</th></tr></thead><tbody>`+
    ROWS.map((r,i)=>{
      const hi=String(r.anon_consent||'')==='نعم';
      const d=r.submittedAt?new Date(r.submittedAt):null;
      const ds=d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:'—';
      return `<tr class="clk" data-i="${i}"><td>${esc(r.name)}</td><td style="font-size:12.5px">${esc(r.work_mode||'—')}</td><td style="font-size:12.5px">${esc(r.clients_count||'—')}</td>`+
        `<td><span class="badge ${hi?'hi':''}" style="font-size:11.5px">${esc(r.anon_consent||'—')}</span></td><td class="mono">${ds}</td></tr>`;
    }).join('')+`</tbody></table>`;
  $('tableWrap').querySelectorAll('tr.clk').forEach(tr=>tr.onclick=()=>openDetail(ROWS[+tr.dataset.i]));
}

function openDetail(r){
  $('dBody').innerHTML=Object.keys(F).map(k=>{
    const v=r[k];if(v==null||v===''||(Array.isArray(v)&&!v.length))return '';
    let ov=val(v);
    if(v==='__other__'||(Array.isArray(v)&&v.includes('__other__')))ov+=r[k+'__other']?` (${r[k+'__other']})`:'';
    return `<div class="qa"><div class="ql">${esc(F[k][0])}</div><div class="qv">${esc(ov)}</div></div>`;
  }).join('');
  $('detail').classList.add('on');
}
$('dClose').onclick=()=>$('detail').classList.remove('on');
$('detail').onclick=e=>{if(e.target.id==='detail')$('detail').classList.remove('on');};

/* CSV */
$('csvBtn').onclick=()=>{
  const keys=Object.keys(F);
  const head=['submittedAt',...keys.map(k=>F[k][0])];
  const esc2=s=>`"${String(s??'').replace(/"/g,'""')}"`;
  const lines=[head.map(esc2).join(',')];
  ROWS.forEach(r=>{
    lines.push([r.submittedAt||'',...keys.map(k=>{let v=r[k];if(Array.isArray(v))v=v.map(x=>x==='__other__'?'آخر':x).join(' | ');if(v==='__other__')v='آخر';return v;})].map(esc2).join(','));
  });
  const blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='elite-editor-responses.csv';a.click();
};
</script>
</body>
</html>
