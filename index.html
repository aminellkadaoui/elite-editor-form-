<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Elite Editor System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#6d5cff; --brand2:#4d8dff; --brand-ink:#5a3ff0;
  --grad:linear-gradient(120deg,#6d5cff,#4d8dff);
  --ink:#17191f; --soft:#565f70; --faint:#8a90a0;
  --line:#e8e9f1; --bg:#f3f4f8; --dark:#16181d;
  --ar:'IBM Plex Sans Arabic',sans-serif; --mono:'IBM Plex Mono',monospace;
  --t-fast:170ms; --t-med:300ms;
  --ease:cubic-bezier(.4,0,.2,1);
  --spring:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--ar); background:var(--bg); color:var(--ink); line-height:1.7;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100dvh; overflow-x:hidden;
}
/* شريط تقدّم علوي رفيع */
.bar{position:fixed;top:0;left:0;right:0;z-index:30;height:3px;background:rgba(109,92,255,.08)}
.bar i{display:block;height:100%;width:0;background:var(--brand);border-radius:0 3px 3px 0;
  transition:width var(--t-med) var(--spring)}

/* المسرح */
.stage-wrap{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:44px clamp(16px,5vw,28px) 44px;gap:20px}
.hero{text-align:center;max-width:560px}
.brandtop{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;color:#3a3f4b;letter-spacing:-.01em}
.brandtop .dot{width:9px;height:9px;border-radius:50%;background:var(--grad);box-shadow:0 0 0 4px rgba(109,92,255,.12)}
.typewriter{font-weight:700;font-size:clamp(19px,4.2vw,32px);line-height:1.45;letter-spacing:-.02em;color:var(--ink);
  margin-top:12px;min-height:2.4em;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.28em}
.tw-hl{color:var(--brand);font-weight:700}
.subhero{color:var(--soft);font-size:14.5px;line-height:1.75;margin:12px auto 0;max-width:500px}
.tw-caret{display:inline-block;width:2px;height:1.05em;background:var(--brand);border-radius:2px;transform:translateY(3px);
  animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.stage{width:100%;max-width:496px}

/* البطاقة */
.slide{background:#fff;border:1px solid var(--line);border-radius:16px;
  box-shadow:0 24px 60px -34px rgba(24,26,52,.35), 0 3px 10px -6px rgba(24,26,52,.10);
  padding:28px clamp(20px,4vw,30px) 24px;will-change:transform,opacity}
.slide.in{animation:rise .3s var(--ease) both}
.slide.out{animation:sink .14s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sink{from{opacity:1}to{opacity:0}}

.cstep{font-family:var(--mono);font-size:12px;color:var(--faint);direction:ltr;letter-spacing:.03em;margin-bottom:12px}
.cstep b{color:var(--brand-ink);font-weight:600}
.qh{font-size:clamp(18px,3.6vw,22px);font-weight:600;line-height:1.5;letter-spacing:-.01em;color:var(--ink)}
.req{color:var(--brand)}
.hint{color:var(--faint);font-size:14px;margin-top:7px;line-height:1.6}
.field{margin-top:20px}

/* مدخلات نصية */
.tin{width:100%;font-family:var(--ar);font-size:16px;color:var(--ink);
  background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;outline:none;
  transition:border-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.tin::placeholder{color:#aab0be}
.tin:hover{border-color:#d3d7e2}
.tin:focus{border-color:var(--brand);box-shadow:0 0 0 3.5px rgba(109,92,255,.13)}
.tin.bad{border-color:#e6a9a4;box-shadow:0 0 0 3.5px rgba(208,72,63,.10)}
textarea.tin{min-height:110px;resize:vertical;line-height:1.7;font-size:15.5px}
.tin[dir=ltr]{direction:ltr;text-align:right;font-family:var(--mono);letter-spacing:.02em}
.suffix{position:relative}
.suffix .cur{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint);
  font-family:var(--mono);font-size:15px;pointer-events:none}
.suffix .tin{padding-left:38px}

/* خيارات */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{position:relative;display:flex;align-items:center;gap:12px;
  border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;background:#fff;user-select:none;
  transition:border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease)}
.opt:hover{border-color:#cfd3e0;background:#fafbff}
.opt:active{background:#f5f4ff}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .tx{flex:1;font-size:15.5px;font-weight:500;color:#2a2e39}
.opt .tick{flex:0 0 18px;width:18px;height:18px;border-radius:50%;border:2px solid #d1d6e2;position:relative;
  transition:border-color var(--t-fast) var(--ease)}
.opt .tick.sq{border-radius:6px}
.opt .tick::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--brand);
  transform:scale(0);transition:transform var(--t-fast) var(--spring)}
.opt .tick.sq::after{border-radius:2px}
.opt.sel{border-color:var(--brand);background:rgba(109,92,255,.055)}
.opt.sel .tx{color:var(--ink);font-weight:600}
.opt.sel .tick{border-color:var(--brand)}
.opt.sel .tick::after{transform:scale(1)}
.otherwrap{max-height:0;overflow:hidden;opacity:0;transition:max-height var(--t-med) var(--ease),opacity var(--t-med) var(--ease)}
.otherwrap.on{max-height:110px;opacity:1;margin-top:8px}

/* مقياس ١–١٠ */
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;direction:ltr}
.scale button{height:46px;border:1.5px solid var(--line);background:#fff;border-radius:9px;
  font-family:var(--mono);font-size:15px;color:var(--soft);cursor:pointer;
  transition:transform var(--t-fast) var(--spring),border-color var(--t-fast) var(--ease),
    background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.scale button:hover{border-color:#cfd3e0}
.scale button:active{transform:scale(.92);transition-duration:50ms}
.scale button.sel{background:var(--brand);color:#fff;border-color:var(--brand)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:9px;gap:12px}
@media(max-width:480px){.scale{grid-template-columns:repeat(5,1fr)}.scale button{height:44px}}

/* أزرار */
.emsg{color:#c0392b;font-size:13px;margin-top:11px;min-height:16px;display:none}
.emsg.on{display:block;animation:rise .28s var(--spring) both}
.nav{display:flex;align-items:center;gap:10px;margin-top:22px}
.nav.two{justify-content:space-between}
.nav.one{justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 30px;
  border-radius:60px;font-family:var(--ar);font-weight:600;font-size:15.5px;border:0;cursor:pointer;
  transition:transform var(--t-fast) var(--ease),background var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease),opacity var(--t-fast)}
.btn:active{transform:scale(.9);opacity:.8;transition-duration:90ms}
/* الزر الأساسي: بيضة سوداء نظيفة بدون أنيميشن (أسود/أبيض) */
.btn.prim{background:#0d0d0d;color:#fff;min-width:138px;box-shadow:0 8px 18px -12px rgba(0,0,0,.45)}
.btn.prim:hover{background:#000}
.btn.prim:disabled{opacity:.7;cursor:wait}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:#3a3f4b;height:46px;padding:0 22px}
.btn.ghost:hover{border-color:#cfd3e0;background:#fafbfc}
.dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:#fff;margin:0 1.5px;animation:dot 1.1s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.18s}.dots span:nth-child(3){animation-delay:.36s}
@keyframes dot{0%,100%{opacity:.3}40%{opacity:1}}

/* شاشة الشكر */
.done{position:relative;z-index:2;min-height:100dvh;display:none;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:40px 24px}
.done.on{display:flex;animation:rise .5s var(--spring) both}
.done .card2{background:#fff;border:1px solid var(--line);border-radius:16px;padding:40px 32px;max-width:460px;
  box-shadow:0 24px 60px -34px rgba(24,26,52,.35)}
.done .ic{width:72px;height:72px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;
  font-size:34px;margin:0 auto 22px;box-shadow:0 16px 34px -16px rgba(93,63,240,.7)}
.done h2{font-size:clamp(21px,4.5vw,26px);font-weight:600;letter-spacing:-.01em;margin-bottom:12px}
.done p{color:var(--soft);font-size:15px;line-height:1.75}
.done .sig{margin-top:24px;font-family:var(--mono);font-size:12px;color:var(--brand-ink);letter-spacing:.14em;direction:ltr;font-weight:600}
.founders{display:flex;flex-direction:column;gap:7px;margin-top:14px;align-items:center}
.founders div{display:flex;align-items:center;gap:8px}
.founders .role{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--faint)}
.founders a{color:var(--ink);text-decoration:none;font-weight:600;font-size:13.5px;direction:ltr;unicode-bidi:plaintext;
  display:inline-flex;align-items:center;gap:5px;transition:color var(--t-fast) var(--ease)}
.founders a:hover{color:var(--brand)}
.founders a svg{width:14px;height:14px}

@keyframes fade{from{opacity:0}to{opacity:1}}
/* حتى مع «تقليل الحركة»: نُبقي تلاشيًا بسيطًا (opacity فقط، بلا إزاحة) */
@media(prefers-reduced-motion:reduce){
  .slide.in{animation:fade .3s var(--ease) both}
  .slide.out{animation:sink .14s var(--ease) both}
  .done.on{animation:fade .32s var(--ease) both}
  .emsg.on{animation:none}
}
</style>
</head>

<div class="bar"><i id="pfill"></i></div>

<main class="stage-wrap" id="stageWrap">

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyAou6PxuGGpDSNnmZ1ja4eMYIke3OR_sXY",
  authDomain: "elite-editor-9fe62.firebaseapp.com",
  projectId: "elite-editor-9fe62",
  storageBucket: "elite-editor-9fe62.firebasestorage.app",
  messagingSenderId: "705152552088",
  appId: "1:705152552088:web:c9b082ee8d5f0a1565d4ed"
};
const COLLECTION="elite_responses";
const LS="elite_editor_form_v7";
/* الكتابة عبر REST API مباشرة — يتجاوز مانع الإعلانات الذي يحجب اتصال الـSDK */
const FS_DBS=["default","(default)"]; // نجرّب الاسمين
const fsDocs=id=>"https://firestore.googleapis.com/v1/projects/"+firebaseConfig.projectId+"/databases/"+id+"/documents";
function toFirestoreFields(obj){
  const f={};
  for(const k in obj){ const v=obj[k];
    if(v===undefined||v===null||v==='')continue;
    if(Array.isArray(v)) f[k]={arrayValue:{values:v.map(x=>({stringValue:String(x)}))}};
    else if(typeof v==='number') f[k]=Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};
    else if(typeof v==='boolean') f[k]={booleanValue:v};
    else f[k]={stringValue:String(v)};
  }
  return f;
}

/* ── الأسئلة: مختصرة وفعّالة (سؤال واحد لكل شاشة) ── */
const Q=[
 {k:"name",type:"text",label:"ما اسمك؟",req:true,ph:"اكتب اسمك"},
 {k:"whatsapp",type:"tel",label:"ما رقمك على WhatsApp؟",hint:"نستخدمه للتواصل معك وإرسال تفاصيل التدريب — بلا إزعاج، قيمة حقيقية فقط.",req:true,ph:"+212 6 00 00 00 00"},
 {k:"age",type:"radio",label:"كم عمرك؟",req:true,opts:["18 – 24","25 – 34","35 – 44","45 فأكثر"]},
 {k:"current_status",type:"radio",label:"ما وضعك الحالي كإديتور؟",req:true,opts:[
   "ما زلت أتعلّم الإيديتنج","إديتور مستقل أعمل مع عملاء","أعمل داخل فريق أو وكالة","أبحث عن أول فرصة عمل"]},
 {k:"monthly_income",type:"radio",label:"كم يبلغ دخلك الشهري من الإيديتنج حاليًا؟",req:true,opts:[
   "لا أحقق دخلًا بعد","أقل من 200$","من 200$ إلى 499$","من 500$ إلى 999$","1000$ أو أكثر"]},
 {k:"biggest_barrier",type:"radio",label:"ما أكبر عائق يمنعك من رفع دخلك من الإيديتنج؟",req:true,other:true,opts:[
   "مستوايَ التقني غير كافٍ","لا أملك Portfolio قويًا","لا أعرف كيف أجد عملاء أفضل","لا أعرف كيف أبيع مهارتي"]},
 {k:"main_struggle",type:"textarea",label:"بأسلوبك الخاص: ما أكبر مشكلة تواجهك الآن كإديتور؟",hint:"اكتب ما يعيقك أو يتعبك فعلًا.",req:true,ph:"اكتب مشكلتك هنا..."},
 {k:"most_valuable",type:"radio",label:"ما النتيجة الأهم التي تريد الوصول إليها؟",req:true,opts:[
   "رفع جودة أعمالي","مضاعفة دخلي الشهري","الحصول على عميل ثابت","تعلّم كيف أبيع مهارتي"]},
 {k:"training_wants",type:"checkbox",label:"ما الذي تريد أن يتضمّنه التدريب؟",hint:"اختر كل ما تحتاجه — يمكنك اختيار أكثر من إجابة.",req:true,other:true,opts:[
   "دروس مسجّلة ومنظّمة","مشاريع عملية مع Feedback على أعمالي","مجتمع (Community) للإديتورز","جلسات مباشرة (Live)","قوالب وTemplates جاهزة","تدريب على إيجاد العملاء وبيع المهارة"]},
 {k:"budget",type:"radio",label:"كم يمكنك أن تستثمر لتصل إلى هدفك بشكل أسرع؟",req:true,opts:[
   "0$ — لست مستعدًا حاليًا","1$ – 99$ — أبدأ بخطوات بسيطة","100$ – 499$ — مهتم وأبحث عن القيمة","500$ أو أكثر — مستعد وأبحث عن نتائج قوية"]},
 {k:"trial_interest",type:"radio",label:"إذا أطلقنا نسخة تجريبية أولى بسعر خاص، فهل يهمّك الأمر؟",req:true,opts:[
   "نعم، أرغب في معرفة التفاصيل","ربما، بحسب السعر","لا في الوقت الحالي"]},
 {k:"whatsapp_consent",type:"radio",label:"هل تسمح لنا بالتواصل معك عبر واتساب لاحقًا؟",req:true,opts:[
   "نعم، بكل سرور","لا، شكرًا"]},
];

const total=Q.length;
const data=JSON.parse(localStorage.getItem(LS)||"{}");
let idx=0;
(function resume(){ for(let i=0;i<total;i++){const v=data[Q[i].k];
  if(v===undefined||v===''||v===null){idx=i;return;} } idx=0; })();

const $=id=>document.getElementById(id);
const stage=$('stage'), stageWrap=$('stageWrap');
const esc=s=>{const d=document.createElement('span');d.textContent=(s??'');return d.innerHTML;};
const save=()=>localStorage.setItem(LS,JSON.stringify(data));

function render(){
  const q=Q[idx], v=data[q.k], last=idx===total-1;
  let h=`<div class="slide in"><div class="cstep"><b>${String(idx+1).padStart(2,'0')}</b> / ${total}</div>`;
  h+=`<div class="qh">${esc(q.label)}${q.req?' <span class="req">*</span>':''}</div>`;
  if(q.hint)h+=`<div class="hint">${esc(q.hint)}</div>`;
  h+=`<div class="field">`;
  if(q.type==='text'||q.type==='tel'||q.type==='number'){
    if(q.type==='number'){
      h+=`<div class="suffix"><span class="cur">$</span><input class="tin" dir="ltr" inputmode="numeric" type="number" ${q.min!=null?`min="${q.min}"`:''} data-in value="${v!=null?esc(v):''}" placeholder="${esc(q.ph||'')}"></div>`;
    } else {
      const ltr=(q.type==='tel');
      h+=`<input class="tin" ${ltr?'dir="ltr" inputmode="tel"':''} type="${q.type==='tel'?'tel':'text'}" data-in value="${v!=null?esc(v):''}" placeholder="${esc(q.ph||'')}">`;
    }
  } else if(q.type==='textarea'){
    h+=`<textarea class="tin" data-in placeholder="${esc(q.ph||'اكتب إجابتك...')}">${v?esc(v):''}</textarea>`;
  } else if(q.type==='scale'){
    h+=`<div class="scale" data-scale>`;
    for(let n=1;n<=10;n++)h+=`<button type="button" data-n="${n}" class="${v==n?'sel':''}">${n}</button>`;
    h+=`</div><div class="ends"><span>1 · ${esc(q.lo)}</span><span>${esc(q.hi)} · 10</span></div>`;
  } else { // radio أو checkbox (اختيار متعدد)
    const cb=q.type==='checkbox', arr=(cb&&Array.isArray(v))?v:[];
    h+=`<div class="opts" data-opts ${cb?'data-multi':''}>`;
    q.opts.forEach(o=>{
      const on=cb?arr.includes(o):(v===o);
      h+=`<label class="opt ${on?'sel':''}"><span class="tx">${esc(o)}</span><span class="tick ${cb?'sq':''}"></span><input type="${cb?'checkbox':'radio'}" name="${q.k}" value="${esc(o)}" ${on?'checked':''}></label>`;
    });
    if(q.other){
      const oon=cb?arr.includes('__other__'):(v==='__other__'), ov=data[q.k+'__other'];
      h+=`<label class="opt ${oon?'sel':''}" data-other-opt><span class="tx">شيء آخر…</span><span class="tick ${cb?'sq':''}"></span><input type="${cb?'checkbox':'radio'}" name="${q.k}" value="__other__" ${oon?'checked':''}></label>`;
      h+=`<div class="otherwrap ${oon?'on':''}" data-otherwrap><input class="tin" data-in-other type="text" value="${ov?esc(ov):''}" placeholder="اكتب هنا..."></div>`;
    }
    h+=`</div>`;
  }
  h+=`</div><div class="emsg" id="emsg"></div>`;
  h+=`<div class="nav ${idx>0?'two':'one'}">`;
  if(idx>0)h+=`<button type="button" class="btn ghost" id="backBtn">رجوع</button>`;
  h+=`<button type="button" class="btn prim" id="nextBtn">${last?'إرسال ✓':'التالي ←'}</button>`;
  h+=`</div></div>`;
  stage.innerHTML=h;
  wire(q);
  $('nextBtn').onclick=go;
  const bb=$('backBtn'); if(bb) bb.onclick=back;
  $('pfill').style.width=(100*(idx+1)/total)+'%';
  const fin=stage.querySelector('[data-in]');
  if(fin && (q.type==='text'||q.type==='tel'||q.type==='number'||q.type==='textarea')) setTimeout(()=>fin.focus(),110);
}

function wire(q){
  const inp=stage.querySelector('[data-in]');
  if(inp)inp.addEventListener('input',()=>{data[q.k]=inp.value;save();inp.classList.remove('bad');clearErr();});
  const oinp=stage.querySelector('[data-in-other]');
  if(oinp)oinp.addEventListener('input',()=>{data[q.k+'__other']=oinp.value;save();});
  const grp=stage.querySelector('[data-opts]');
  if(grp){
    const multi=grp.hasAttribute('data-multi');
    grp.querySelectorAll('.opt').forEach(opt=>{
      const input=opt.querySelector('input');
      input.addEventListener('change',()=>{
        if(multi){
          let arr=Array.isArray(data[q.k])?data[q.k]:[];
          if(input.checked){if(!arr.includes(input.value))arr.push(input.value);}
          else{arr=arr.filter(x=>x!==input.value);}
          data[q.k]=arr;
          opt.classList.toggle('sel',input.checked);
          const ow=grp.querySelector('[data-otherwrap]');
          if(ow){const isOther=arr.includes('__other__');ow.classList.toggle('on',isOther);
            if(input.value==='__other__'&&input.checked)setTimeout(()=>ow.querySelector('input').focus(),120);}
        } else {
          data[q.k]=input.value;
          grp.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o.querySelector('input').checked));
          const ow=grp.querySelector('[data-otherwrap]');
          if(ow){const isOther=input.value==='__other__';ow.classList.toggle('on',isOther);
            if(isOther)setTimeout(()=>ow.querySelector('input').focus(),120);}
        }
        save();clearErr();
      });
    });
  }
  const sc=stage.querySelector('[data-scale]');
  if(sc)sc.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    data[q.k]=+b.dataset.n;save();
    sc.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b));
    clearErr();
  }));
}

function clearErr(){const e=$('emsg');if(e)e.classList.remove('on');}
function showErr(m){const e=$('emsg');if(e){e.textContent=m;e.classList.add('on');}}

function validate(){
  const q=Q[idx], v=data[q.k];
  if(q.req){
    const empty=(v===undefined||v===null||v===''||(Array.isArray(v)&&!v.length));
    if(empty)return 'هذا السؤال مطلوب — اختر إجابة أو اكتبها.';
    const hasOther=Array.isArray(v)?v.includes('__other__'):(v==='__other__');
    if(hasOther && !(data[q.k+'__other']||'').trim())return 'اكتب إجابتك في خانة «شيء آخر».';
    if(q.k==='whatsapp' && (String(v).replace(/\D/g,'').length<6))return 'اكتب رقم واتساب صحيح مع رمز الدولة.';
    if(q.type==='number' && (isNaN(+v)||+v<0))return 'اكتب رقمًا صحيحًا.';
  }
  return null;
}

function transitionOut(cb){
  const s=stage.querySelector('.slide');
  if(!s){cb();return;}
  let fired=false;
  const done=()=>{if(fired)return;fired=true;s.removeEventListener('animationend',done);cb();};
  s.classList.remove('in');s.classList.add('out');
  s.addEventListener('animationend',done);
  setTimeout(done,300);
}
let busy=false;
function go(){
  if(busy)return;
  const err=validate();
  if(err){showErr(err);const f=stage.querySelector('[data-in]');if(f)f.classList.add('bad');return;}
  if(idx>=total-1){submit();return;}
  busy=true;transitionOut(()=>{idx++;render();busy=false;});
}
function back(){
  if(busy||idx===0)return;busy=true;
  transitionOut(()=>{idx--;render();busy=false;});
}

document.addEventListener('keydown',e=>{
  if($('done').classList.contains('on'))return;
  if(e.key==='Enter'){
    if(e.target.tagName==='TEXTAREA' && e.shiftKey)return;
    e.preventDefault();go();return;
  }
  if(/^[1-9]$/.test(e.key)){
    const grp=stage.querySelector('[data-opts]');
    const opts=grp?grp.querySelectorAll('.opt'):[];
    const i=+e.key-1;
    if(opts[i] && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA'){
      const inp=opts[i].querySelector('input');
      inp.checked=grp.hasAttribute('data-multi')?!inp.checked:true;
      inp.dispatchEvent(new Event('change'));
    }
  }
});

async function submit(){
  const btn=$('nextBtn');
  btn.disabled=true;btn.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
  const payload=Object.assign({},data,{submittedAt:new Date().toISOString(),ua:navigator.userAgent.slice(0,180)});
  try{
    const body=JSON.stringify({fields:toFirestoreFields(payload)});
    let ok=false, lastErr='';
    for(const dbid of FS_DBS){
      const res=await fetch(fsDocs(dbid)+"/"+COLLECTION+"?key="+firebaseConfig.apiKey,{
        method:'POST', headers:{'Content-Type':'application/json'}, body
      });
      if(res.ok){ ok=true; break; }
      const t=await res.text();
      if(res.status!==404){ throw new Error('HTTP '+res.status+' — '+t.slice(0,140)); }
      lastErr='HTTP 404';
    }
    if(!ok) throw new Error('قاعدة البيانات غير موجودة ('+lastErr+')');
    localStorage.removeItem(LS);
    stageWrap.style.display='none';
    $('done').classList.add('on');
  }catch(e){
    console.error('submit error:', e);
    btn.disabled=false;btn.textContent='إرسال ✓';
    showErr('تعذّر الإرسال: '+((e&&e.message)?e.message:'خطأ غير معروف'));
  }
}

render();
</script>

<!-- Typewriter headline (منقول للـvanilla من كومبوننت React) -->
<script>
(function(){
  const PHRASE={text:"ساعدنا على بناء",highlight:"شيء يطوّرك."};
  const t=document.querySelector('#tw .tw-text');
  const hl=document.querySelector('#tw .tw-hl');
  if(!t||!hl)return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){
    t.textContent=PHRASE.text+' ';hl.textContent=PHRASE.highlight;return;
  }
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const typeInto=async(el,str,sp)=>{for(let i=1;i<=str.length;i++){el.textContent=str.slice(0,i);await wait(sp);}};
  (async function(){
    await typeInto(t,PHRASE.text+' ',58);
    await typeInto(hl,PHRASE.highlight,58);
  })();
})();
</script>
